<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Railway Display - Admin</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #ffd400;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        .card {
            background: #0d1d31;
            border: 1px solid #28496d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 6px;
            border: 1px solid #526b84;
            background: #06101c;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 7px;
            background: #1261b0;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1976d2;
        }

        .cancel {
            background: #555;
        }

        .train-item {
            background: #07111f;
            border: 1px solid #29435f;
            border-radius: 8px;
            padding: 15px;
            margin-top: 12px;
        }

        .train-title {
            color: #ffd400;
            font-size: 18px;
            font-weight: bold;
        }

        .train-details {
            margin-top: 7px;
            color: #ddd;
            line-height: 1.6;
        }

        .edit-btn {
            background: #087f5b;
        }

        .delete-btn {
            background: #b3261e;
        }

        #status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>🚆 ECE CENTRAL</h1>

    <div class="subtitle">
        Railway Display Admin Panel
    </div>


    <!-- ADD / EDIT FORM -->

    <div class="card">

        <h2 id="formTitle">
            Add Train
        </h2>


        <label>
            Train Number
        </label>

        <input
            id="number"
            type="text"
            placeholder="12661"
        >


        <label>
            Train Name
        </label>

        <input
            id="name"
            type="text"
            placeholder="POTHIGAI EXPRESS"
        >


        <label>
            Arrival
        </label>

        <input
            id="arrival"
            type="text"
            placeholder="18:00"
        >


        <label>
            Departure
        </label>

        <input
            id="departure"
            type="text"
            placeholder="18:05"
        >


        <label>
            Platform
        </label>

        <input
            id="platform"
            type="text"
            placeholder="3"
        >


        <button onclick="saveTrain()">
            SAVE TRAIN
        </button>

        <button
            id="cancelButton"
            class="cancel"
            onclick="cancelEdit()"
            style="display:none;"
        >
            CANCEL EDIT
        </button>


        <div id="status"></div>

    </div>


    <!-- EXISTING TRAINS -->

    <div class="card">

        <h2>
            Current Trains
        </h2>

        <div id="trainList">
            Loading...
        </div>

    </div>

</div>


<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

const firebaseConfig = {

    apiKey: "AIzaSyB10_bGT07hinBy-Ua-cNk5-KrkQ9bS_D8",

    authDomain: "railway-display-f1762.firebaseapp.com",

    projectId: "railway-display-f1762",

    storageBucket: "railway-display-f1762.firebasestorage.app",

    messagingSenderId: "498931138295",

    appId: "1:498931138295:web:6324553c0bfde335c95df2"

};


firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


let editingId = null;


/* =========================================
   SAVE TRAIN
========================================= */

async function saveTrain() {

    const number =
        document.getElementById("number").value.trim();

    const name =
        document.getElementById("name").value.trim();

    const arrival =
        document.getElementById("arrival").value.trim();

    const departure =
        document.getElementById("departure").value.trim();

    const platform =
        document.getElementById("platform").value.trim();


    if (
        !number ||
        !name ||
        !arrival ||
        !departure ||
        !platform
    ) {

        showStatus(
            "Please fill all fields.",
            "red"
        );

        return;
    }


    const trainData = {

        number: number,

        name: name,

        arrival: arrival,

        departure: departure,

        platform: platform

    };


    try {

        if (editingId) {

            await db
                .collection("trains")
                .doc(editingId)
                .update(trainData);

            showStatus(
                "Train updated successfully!",
                "lightgreen"
            );

        } else {

            await db
                .collection("trains")
                .add(trainData);

            showStatus(
                "Train added successfully!",
                "lightgreen"
            );

        }


        clearForm();

    }

    catch (error) {

        console.error(error);

        showStatus(
            "Error saving train: " + error.message,
            "red"
        );

    }

}


/* =========================================
   LOAD TRAINS
========================================= */

db.collection("trains")
    .onSnapshot(function(snapshot) {

        const list =
            document.getElementById("trainList");

        list.innerHTML = "";


        if (snapshot.empty) {

            list.innerHTML =
                "<p>No trains available.</p>";

            return;

        }


        snapshot.forEach(function(doc) {

            const train = doc.data();


            const item =
                document.createElement("div");

            item.className =
                "train-item";


            item.innerHTML = `

                <div class="train-title">

                    ${train.number}
                    -
                    ${train.name}

                </div>

                <div class="train-details">

                    Arrival:
                    ${train.arrival}

                    <br>

                    Departure:
                    ${train.departure}

                    <br>

                    Platform:
                    ${train.platform}

                </div>


                <button
                    class="edit-btn"
                    onclick="editTrain(
                        '${doc.id}',
                        '${escapeValue(train.number)}',
                        '${escapeValue(train.name)}',
                        '${escapeValue(train.arrival)}',
                        '${escapeValue(train.departure)}',
                        '${escapeValue(train.platform)}'
                    )"
                >
                    EDIT
                </button>


                <button
                    class="delete-btn"
                    onclick="deleteTrain('${doc.id}')"
                >
                    DELETE
                </button>

            `;


            list.appendChild(item);

        });

    });


/* =========================================
   EDIT TRAIN
========================================= */

function editTrain(
    id,
    number,
    name,
    arrival,
    departure,
    platform
) {

    editingId = id;


    document.getElementById("number").value =
        number;

    document.getElementById("name").value =
        name;

    document.getElementById("arrival").value =
        arrival;

    document.getElementById("departure").value =
        departure;

    document.getElementById("platform").value =
        platform;


    document.getElementById("formTitle")
        .textContent = "Edit Train";


    document.getElementById("cancelButton")
        .style.display = "block";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =========================================
   DELETE TRAIN
========================================= */

async function deleteTrain(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this train?"
        );


    if (!confirmDelete) {
        return;
    }


    try {

        await db
            .collection("trains")
            .doc(id)
            .delete();


        showStatus(
            "Train deleted successfully!",
            "lightgreen"
        );

    }

    catch (error) {

        showStatus(
            "Delete failed: " + error.message,
            "red"
        );

    }

}


/* =========================================
   CANCEL EDIT
========================================= */

function cancelEdit() {

    editingId = null;

    clearForm();

}


/* =========================================
   CLEAR FORM
========================================= */

function clearForm() {

    document.getElementById("number").value = "";

    document.getElementById("name").value = "";

    document.getElementById("arrival").value = "";

    document.getElementById("departure").value = "";

    document.getElementById("platform").value = "";


    document.getElementById("formTitle")
        .textContent = "Add Train";


    document.getElementById("cancelButton")
        .style.display = "none";


    editingId = null;

}


/* =========================================
   STATUS MESSAGE
========================================= */

function showStatus(message, color) {

    const status =
        document.getElementById("status");

    status.textContent = message;

    status.style.color = color;


    setTimeout(function() {

        status.textContent = "";

    }, 3000);

}


/* =========================================
   SAFE DISPLAY
========================================= */

function escapeValue(value) {

    return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");

}

</script>

</body>

</html>
