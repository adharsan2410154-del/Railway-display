<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Railway Display - Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
            color: #ffd400;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        .card {
            background: #0d1d31;
            border: 1px solid #28496d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border-radius: 6px;
            border: 1px solid #526b84;
            background: #06101c;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 7px;
            background: #1261b0;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1976d2;
        }

        .logout {
            background: #9b1c1c;
        }

        .logout:hover {
            background: #c62828;
        }

        .cancel {
            background: #555;
        }

        .edit-btn {
            background: #087f5b;
        }

        .delete-btn {
            background: #b3261e;
        }

        .train-item {
            background: #07111f;
            border: 1px solid #29435f;
            border-radius: 8px;
            padding: 15px;
            margin-top: 12px;
        }

        .train-title {
            color: #ffd400;
            font-size: 18px;
            font-weight: bold;
        }

        .train-details {
            margin-top: 7px;
            color: #ddd;
            line-height: 1.6;
        }

        #loginSection,
        #adminSection {
            display: none;
        }

        #status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .error {
            color: #ff6b6b;
            text-align: center;
            margin-top: 15px;
        }

        .success {
            color: lightgreen;
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>


<body>

<div class="container">

    <!-- =========================
         LOGIN
    ========================== -->

    <div id="loginSection">

        <div class="card">

            <h1>🔐 RAILWAY ADMIN</h1>

            <div class="subtitle">
                ECE CENTRAL Railway Display
            </div>

            <label>Email</label>

            <input
                id="loginEmail"
                type="email"
                placeholder="Enter admin email"
            >

            <label>Password</label>

            <input
                id="loginPassword"
                type="password"
                placeholder="Enter password"
            >

            <button onclick="login()">
                LOGIN
            </button>

            <div id="loginStatus"></div>

        </div>

    </div>


    <!-- =========================
         ADMIN PANEL
    ========================== -->

    <div id="adminSection">

        <h1>🚆 ECE CENTRAL</h1>

        <div class="subtitle">
            Railway Display Admin Panel
        </div>

        <div class="card">

            <button
                class="logout"
                onclick="logout()"
            >
                LOGOUT
            </button>

        </div>


        <!-- ADD / EDIT TRAIN -->

        <div class="card">

            <h2 id="formTitle">
                Add Train
            </h2>

            <label>
                Train Number
            </label>

            <input
                id="number"
                type="text"
                placeholder="12661"
            >

            <label>
                Train Name
            </label>

            <input
                id="name"
                type="text"
                placeholder="POTHIGAI EXPRESS"
            >

            <label>
                Arrival
            </label>

            <input
                id="arrival"
                type="text"
                placeholder="18:00"
            >

            <label>
                Departure
            </label>

            <input
                id="departure"
                type="text"
                placeholder="18:05"
            >

            <label>
                Platform
            </label>

            <input
                id="platform"
                type="text"
                placeholder="3"
            >

            <button onclick="saveTrain()">
                SAVE TRAIN
            </button>

            <button
                id="cancelButton"
                class="cancel"
                onclick="cancelEdit()"
                style="display:none;"
            >
                CANCEL EDIT
            </button>

            <div id="status"></div>

        </div>


        <!-- CURRENT TRAINS -->

        <div class="card">

            <h2>
                Current Trains
            </h2>

            <div id="trainList">
                Loading...
            </div>

        </div>

    </div>

</div>


<!-- =========================
     FIREBASE SDK
========================== -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>


<script>

const firebaseConfig = {

    apiKey: "AIzaSyB10_bGT07hinBy-Ua-cNk5-KrkQ9bS_D8",

    authDomain: "railway-display-f1762.firebaseapp.com",

    projectId: "railway-display-f1762",

    storageBucket: "railway-display-f1762.firebasestorage.app",

    messagingSenderId: "498931138295",

    appId: "1:498931138295:web:6324553c0bfde335c95df2"

};


firebase.initializeApp(firebaseConfig);


const auth = firebase.auth();

const db = firebase.firestore();


let editingId = null;


/* =========================
   AUTHENTICATION
========================= */

auth.onAuthStateChanged(function(user) {

    if (user) {

        document.getElementById("loginSection")
            .style.display = "none";

        document.getElementById("adminSection")
            .style.display = "block";

        loadTrains();

    } else {

        document.getElementById("loginSection")
            .style.display = "block";

        document.getElementById("adminSection")
            .style.display = "none";

    }

});


/* =========================
   LOGIN
========================= */

function login() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;


    if (!email || !password) {

        showLoginStatus(
            "Enter email and password.",
            "error"
        );

        return;
    }


    auth.signInWithEmailAndPassword(
        email,
        password
    )

    .then(function() {

        showLoginStatus(
            "Login successful!",
            "success"
        );

    })

    .catch(function(error) {

        console.error(error);

        showLoginStatus(
            "Login failed: " + error.message,
            "error"
        );

    });

}


/* =========================
   LOGOUT
========================= */

function logout() {

    auth.signOut();

}


/* =========================
   SAVE TRAIN
========================= */

async function saveTrain() {

    const number =
        document.getElementById("number").value.trim();

    const name =
        document.getElementById("name").value.trim();

    const arrival =
        document.getElementById("arrival").value.trim();

    const departure =
        document.getElementById("departure").value.trim();

    const platform =
        document.getElementById("platform").value.trim();


    if (
        !number ||
        !name ||
        !arrival ||
        !departure ||
        !platform
    ) {

        showStatus(
            "Please fill all fields.",
            "red"
        );

        return;
    }


    const trainData = {

        number: number,

        name: name,

        arrival: arrival,

        departure: departure,

        platform: platform

    };


    try {

        if (editingId) {

            await db
                .collection("trains")
                .doc(editingId)
                .update(trainData);

            showStatus(
                "Train updated successfully!",
                "lightgreen"
            );

        } else {

            await db
                .collection("trains")
                .add(trainData);

            showStatus(
                "Train added successfully!",
                "lightgreen"
            );

        }


        clearForm();

    }

    catch (error) {

        console.error(error);

        showStatus(
            "Error: " + error.message,
            "red"
        );

    }

}


/* =========================
   LOAD TRAINS
========================= */

function loadTrains() {

    db.collection("trains")
        .onSnapshot(function(snapshot) {

            const list =
                document.getElementById("trainList");

            list.innerHTML = "";


            if (snapshot.empty) {

                list.innerHTML =
                    "<p>No trains available.</p>";

                return;

            }


            snapshot.forEach(function(doc) {

                const train = doc.data();


                const item =
                    document.createElement("div");

                item.className =
                    "train-item";


                item.innerHTML = `

                    <div class="train-title">

                        ${train.number}
                        -
                        ${train.name}

                    </div>

                    <div class="train-details">

                        Arrival:
                        ${train.arrival}

                        <br>

                        Departure:
                        ${train.departure}

                        <br>

                        Platform:
                        ${train.platform}

                    </div>

                    <button
                        class="edit-btn"
                        onclick="editTrain(
                            '${doc.id}'
                        )"
                    >
                        EDIT
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteTrain(
                            '${doc.id}'
                        )"
                    >
                        DELETE
                    </button>

                `;


                list.appendChild(item);

            });

        });

}


/* =========================
   EDIT TRAIN
========================= */

async function editTrain(id) {

    try {

        const doc =
            await db
                .collection("trains")
                .doc(id)
                .get();


        if (!doc.exists) {

            return;

        }


        const train = doc.data();


        editingId = id;


        document.getElementById("number").value =
            train.number || "";

        document.getElementById("name").value =
            train.name || "";

        document.getElementById("arrival").value =
            train.arrival || "";

        document.getElementById("departure").value =
            train.departure || "";

        document.getElementById("platform").value =
            train.platform || "";


        document.getElementById("formTitle")
            .textContent = "Edit Train";


        document.getElementById("cancelButton")
            .style.display = "block";


        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

    catch (error) {

        showStatus(
            "Unable to load train.",
            "red"
        );

    }

}


/* =========================
   DELETE TRAIN
========================= */

async function deleteTrain(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this train?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        await db
            .collection("trains")
            .doc(id)
            .delete();


        showStatus(
            "Train deleted successfully!",
            "lightgreen"
        );

    }

    catch (error) {

        console.error(error);

        showStatus(
            "Delete failed: " + error.message,
            "red"
        );

    }

}


/* =========================
   CANCEL EDIT
========================= */

function cancelEdit() {

    editingId = null;

    clearForm();

}


/* =========================
   CLEAR FORM
========================= */

function clearForm() {

    document.getElementById("number").value = "";

    document.getElementById("name").value = "";

    document.getElementById("arrival").value = "";

    document.getElementById("departure").value = "";

    document.getElementById("platform").value = "";


    document.getElementById("formTitle")
        .textContent = "Add Train";


    document.getElementById("cancelButton")
        .style.display = "none";


    editingId = null;

}


/* =========================
   STATUS
========================= */

function showStatus(message, color) {

    const status =
        document.getElementById("status");

    status.textContent = message;

    status.style.color = color;


    setTimeout(function() {

        status.textContent = "";

    }, 3000);

}


function showLoginStatus(message, type) {

    const status =
        document.getElementById("loginStatus");

    status.textContent = message;

    status.className = type;

}

</script>

</body>

</html>
