<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ECE Central Railway Station</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="railway-screen">

        <!-- TOP RAILWAY HEADER -->

        <header class="railway-header">

            <div class="railway-left">

                <div class="sr-emblem">
                    SR
                </div>

                <div>
                    <div class="railway-name">
                        SOUTHERN RAILWAY
                    </div>

                    <div class="railway-subtitle">
                        CHENNAI DIVISION
                    </div>
                </div>

            </div>


            <div class="station-center">

                <div class="station-name">
                    ECE CENTRAL
                </div>

                <div class="station-type">
                    RAILWAY STATION
                </div>

            </div>


            <div class="clock-area">

                <div id="clock">
                    00:00:00
                </div>

                <div id="date">
                    Loading...
                </div>

            </div>

        </header>


        <!-- BOARD TITLE -->

        <div class="board-title">

            <span class="indicator"></span>

            <span>
                ARRIVALS / DEPARTURES
            </span>

            <span class="indicator"></span>

        </div>


        <!-- COLUMN HEADERS -->

        <div class="table-header">

            <div>TRAIN NO.</div>

            <div>TRAIN NAME</div>

            <div>ARRIVAL</div>

            <div>DEPARTURE</div>

            <div>PLATFORM</div>

        </div>


        <!-- FIREBASE TRAIN DATA
             script.js fills this area -->

        <main class="train-window">

            <div id="train-list"></div>

        </main>


        <!-- BOTTOM INFORMATION BAR -->

        <footer class="bottom-bar">

            <div class="live-status">

                <span class="green-dot"></span>

                LIVE

            </div>

            <div class="announcement">

                PLEASE CHECK THE DISPLAY FOR
                PLATFORM CHANGES

            </div>

            <div class="station-code">

                ECE

            </div>

        </footer>

    </div>


    <!-- FIREBASE -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script src="script.js"></script>

</body>

</html>
