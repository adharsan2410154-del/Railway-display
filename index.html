
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ECE Central Railway Station</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="station-board">


        <!-- TOP HEADER -->

        <header class="top-header">


            <!-- RAILWAY -->

            <div class="railway-info">

                <div class="railway-logo">
                    SR
                </div>

                <div class="railway-name">
                    SOUTHERN RAILWAY
                </div>

                <div class="welcome">
                    WELCOMES YOU
                </div>

            </div>


            <!-- STATION -->

            <div class="station-info">

                <h1>ECE CENTRAL</h1>

                <h2>RAILWAY STATION</h2>

            </div>


            <!-- CLOCK -->

            <div class="time-info">

                <div id="clock">
                    00:00:00
                </div>

                <div id="date">
                    Loading...
                </div>

            </div>

        </header>



        <!-- TABLE HEADER -->

        <div class="table-header">

            <div>TRAIN NUMBER</div>

            <div>TRAIN NAME</div>

            <div>ARRIVAL</div>

            <div>DEPARTURE</div>

            <div>PLATFORM</div>

        </div>



        <!-- TRAIN DISPLAY -->

        <main class="train-window">

            <div id="train-list">

                <!-- JavaScript inserts trains here -->

            </div>

        </main>



        <!-- BOTTOM MESSAGE -->

        <footer class="bottom-bar">

            <div class="scrolling-message">

                PASSENGERS ARE REQUESTED TO CHECK PLATFORM CHANGES
                &nbsp;&nbsp;&nbsp; • &nbsp;&nbsp;&nbsp;
                PLEASE STAND BEHIND THE YELLOW LINE
                &nbsp;&nbsp;&nbsp; • &nbsp;&nbsp;&nbsp;
                HAVE A SAFE JOURNEY

            </div>

        </footer>


    </div>


    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="script.js"></script>

</body>

</html>
